<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign Up | Event Hub</title><link rel="stylesheet" href="style.css"></head><body class="auth-page"><nav class="navbar"><div class="nav-inner"><a class="logo" href="signin.html"><span class="logo-mark">EH</span>Event Hub</a><div class="nav-actions"><a class="btn btn-light" href="signin.html">Sign In</a></div></div></nav><main class="container auth-wrap"><section class="form auth-card"><span class="eyebrow">JOIN EVENT HUB</span><h1>Create your account</h1><p class="desc">A few details and you’re ready to explore campus events.</p><form id="accountRegisterForm" class="form-grid" novalidate><div class="field full"><label for="accountName">Full Name</label><input id="accountName" type="text" placeholder="Your name" required></div><div class="field full"><label for="accountEmail">Email Address</label><input id="accountEmail" type="email" placeholder="you@example.com" required></div><div class="field"><label for="accountPassword">Password</label><input id="accountPassword" type="password" placeholder="Create a password" required></div><div class="field"><label for="accountConfirm">Confirm Password</label><input id="accountConfirm" type="password" placeholder="Repeat password" required></div><div class="field full"><div id="signupMessage" aria-live="polite"></div><button class="btn btn-primary" type="submit">Create Account</button><p class="desc">Already have an account? <a href="signin.html">Sign in</a></p></div></form></section></main><script src="script.js"></script></body></html>
