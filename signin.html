<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign In | Event Hub</title><link rel="stylesheet" href="style.css"></head><body class="auth-page"><nav class="navbar"><div class="nav-inner"><a class="logo" href="signin.html"><span class="logo-mark">EH</span>Event Hub</a><div class="nav-actions"><a class="btn btn-light" href="signup.html">Sign Up</a></div></div></nav><main class="container auth-wrap"><section class="form auth-card"><span class="eyebrow">WELCOME BACK</span><h1>Sign in to Event Hub</h1><p class="desc">Log in to discover events, manage registrations and more.</p><form id="signinForm" class="form-grid"><div class="field full"><label for="loginEmail">Email Address</label><input id="loginEmail" type="email" placeholder="you@example.com" required></div><div class="field full"><label for="loginPassword">Password</label><div class="password-row"><input id="loginPassword" type="password" placeholder="Enter your password" required><button id="togglePassword" class="btn btn-light" type="button">Show</button></div></div><div class="field full"><div id="loginMessage" aria-live="polite"></div><button class="btn btn-primary" type="submit">Sign In</button><p class="desc">New to Event Hub? <a href="signup.html">Create an account</a></p></div></form></section></main><script src="script.js"></script></body></html>
